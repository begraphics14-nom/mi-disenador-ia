<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interior Studio | be graphics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #eee; }
        .accent-border { border-color: #f97316; }
        .selected { background: #f97316 !important; color: white !important; border-color: #f97316; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="p-5 border-b border-zinc-900 flex justify-between items-center bg-black">
        <div class="text-2xl font-black italic tracking-tighter">
            BE <span class="text-orange-500">GRAPHICS</span> <span class="text-[10px] not-italic font-light text-zinc-500 uppercase tracking-[0.2em] ml-2">AI Interior Lab</span>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-10 max-w-5xl">
        <div class="grid lg:grid-cols-2 gap-12">
            
            <div class="space-y-8">
                <div>
                    <h2 class="text-4xl font-bold mb-2">Reimagina tu sala</h2>
                    <p class="text-zinc-500">Sube una foto y deja que la IA aplique un nuevo estilo.</p>
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-medium text-zinc-400">1. Selecciona tu foto</label>
                    <input type="file" id="photo" accept="image/*" class="block w-full text-sm text-zinc-400 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer transition-all">
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-medium text-zinc-400">2. Elige el estilo de diseño</label>
                    <div class="grid grid-cols-3 gap-2" id="styleGroup">
                        <button onclick="selectStyle(this, 'Modern')" class="p-3 rounded-xl border border-zinc-800 bg-zinc-900 hover:border-orange-500 transition-all text-sm font-bold uppercase">Moderno</button>
                        <button onclick="selectStyle(this, 'Minimalist')" class="p-3 rounded-xl border border-zinc-800 bg-zinc-900 hover:border-orange-500 transition-all text-sm font-bold uppercase">Minimalista</button>
                        <button onclick="selectStyle(this, 'Traditional')" class="p-3 rounded-xl border border-zinc-800 bg-zinc-900 hover:border-orange-500 transition-all text-sm font-bold uppercase">Tradicional</button>
                    </div>
                </div>

                <button onclick="generateDesign()" id="genBtn" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-orange-500 hover:text-white transition-all shadow-2xl shadow-orange-900/20">
                    Generar Espacio
                </button>
            </div>

            <div class="relative group">
                <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/80 z-10 flex flex-col items-center justify-center rounded-3xl backdrop-blur-sm">
                    <div class="w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-orange-500 font-bold tracking-widest animate-pulse">RENDERIZANDO...</p>
                </div>
                
                <div class="aspect-square bg-zinc-900 rounded-3xl border-2 border-dashed border-zinc-800 flex items-center justify-center overflow-hidden">
                    <img id="outputImage" class="hidden w-full h-full object-cover">
                    <div id="emptyState" class="text-center p-10">
                        <div class="text-6xl mb-4">🏠</div>
                        <p class="text-zinc-600 italic">El resultado se mostrará aquí</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let currentStyle = "";

        function selectStyle(btn, style) {
            document.querySelectorAll('#styleGroup button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentStyle = style;
        }

        async function generateDesign() {
            const photoInput = document.getElementById('photo');
            const token = "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"; // REEMPLAZA ESTO
            const btn = document.getElementById('genBtn');
            
            if (!photoInput.files[0] || !currentStyle) {
                alert("Por favor sube una foto y elige un estilo.");
                return;
            }

            // UI State
            document.getElementById('loadingOverlay').classList.remove('hidden');
            btn.disabled = true;

            const imageFile = photoInput.files[0];
            
            try {
                // El modelo "Realistic Vision" es increíble para interiores
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/SG161222/Realistic_Vision_V6.0_B1_noVAE",
                    {
                        headers: { Authorization: `Bearer ${token}` },
                        method: "POST",
                        body: imageFile, // Enviamos la imagen directamente
                    }
                );

                if (!response.ok) throw new Error("Error en la API");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                document.getElementById('outputImage').src = url;
                document.getElementById('outputImage').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
            } catch (error) {
                alert("Hubo un error al generar. Revisa tu Token.");
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
